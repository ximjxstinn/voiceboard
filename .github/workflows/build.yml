name: Build

# Baut bei jedem Push. Bei einem Tag wie "v1.4.1" wird zusätzlich automatisch
# ein Release mit der fertigen Jar und dem Text aus release-notes/<tag>.md erstellt.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: VoiceBoard bauen (26.1 – 26.3)
        run: bash ci-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceboard-mod
          path: out/*.jar
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceBoard ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: out/*.jar
