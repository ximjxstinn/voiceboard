name: Build

# Baut bei jedem Push. Gibt es für die Version aus gradle.properties eine Datei
# release-notes/v<version>.md und noch kein Release, wird es automatisch erstellt
# (mit Tag, fertiger Jar und diesem Text). Neue Version = Nummer erhöhen + Notizen anlegen.
# Danach wird dieselbe Version auf Modrinth hochgeladen (Secret MODRINTH_TOKEN nötig).
# Andere Zweige werden nur gebaut (Jar unter Artifacts), aber nie veröffentlicht.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: VoiceBoard bauen (26.1 – 26.3)
        run: bash ci-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceboard-mod
          path: out/*.jar
      - name: Version prüfen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -f "release-notes/v$v.md" ] && ! gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Neues Release v$v wird erstellt"
          else
            echo "::notice::Kein neues Release (v$v gibt es schon oder keine Release-Notizen)"
          fi
      - name: Release erstellen
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VoiceBoard ${{ steps.ver.outputs.tag }}
          body_path: release-notes/${{ steps.ver.outputs.tag }}.md
          files: out/*.jar
      - name: Auf Modrinth hochladen
        if: github.ref == 'refs/heads/main'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/modrinth-publish.py
