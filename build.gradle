// VoiceBoard – EINE Jar für Minecraft 1.21.11, 26.1, 26.2 und 26.3.
//
//  src/core     Kern ohne Minecraft-Code (Audio, Filter, Einstellungen, Starter)
//  src/client   Menüs, Tasten, HUD – wird für jede Version einzeln gegen deren
//               Minecraft kompiliert und dabei ins Paket mcXX_Y verschoben
//  src/compat   die wenigen Stellen, die sich zwischen den Versionen unterscheiden
//  versions/    ein Unterprojekt pro Minecraft-Version
//
// Der Starter (VoiceBoardEntry) lädt beim Spielstart nur die passende Variante.
//
// 1.21.11 ist noch verschleiert: Diese Variante wird mit Mojang-Namen gebaut und
// anschließend von Loom umgewandelt (remap). Ihr Kern ist mit Java 21 gebaut, damit
// die Jar auch dort startet. 26.x ist unverschleiert und braucht kein Umwandeln.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def rootDirFile = projectDir
// Liefert Kern, Ressourcen und eingebettete Bibliotheken für die fertige Jar (ältestes Java)
def baseVersion = '1.21.11'

subprojects {
	def mc = new Properties()
	file('version.properties').withInputStream { mc.load(it) }
	def variant = 'mc' + projectDir.name.replace('.', '_')
	def remap = mc.remap == 'true'
	def javaVersion = (mc.java ?: '25') as int
	ext.remap = remap

	apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

	version = rootProject.mod_version
	group = rootProject.maven_group

	base {
		archivesName = rootProject.archives_base_name
	}

	// Client-Code in das Paket dieser Variante kopieren (de.ximjxstinn.voiceboard.client -> ...mc26_1 usw.)
	def genDir = layout.buildDirectory.dir('generated/client/java')
	def relocate = tasks.register('relocateClient', Sync) {
		from(new File(rootDirFile, 'src/client/java'))
		from(new File(rootDirFile, "src/compat/${mc.compat}/java"))
		into genDir
		eachFile { f ->
			f.path = f.path.replace('de/ximjxstinn/voiceboard/client/', "de/ximjxstinn/voiceboard/${variant}/")
		}
		includeEmptyDirs = false
		// Optionale Liste "alt => neu" für Namen, die sich in dieser Minecraft-Version unterscheiden
		def replFile = new File(rootDirFile, "src/compat/${mc.compat}/replacements.txt")
		def replacements = []
		if (replFile.exists()) {
			replFile.readLines('UTF-8').each { l ->
				if (l.trim() && !l.trim().startsWith('#') && l.contains('=>')) {
					def parts = l.split('=>', 2)
					replacements << [parts[0].trim(), parts[1].trim()]
				}
			}
		}
		inputs.property('replacements', replacements.toString())
		filter { line ->
			def out = line.replace('de.ximjxstinn.voiceboard.client', "de.ximjxstinn.voiceboard.${variant}")
			replacements.each { r -> out = out.replace(r[0], r[1]) }
			out
		}
		filteringCharset = 'UTF-8'
	}

	sourceSets {
		main {
			java {
				// src/modmenu-api: Nachbau der Mod-Menu-Schnittstelle, nur zum Kompilieren (siehe jar-exclude)
				srcDirs = [new File(rootDirFile, 'src/core/java'), new File(rootDirFile, 'src/modmenu-api/java'), genDir]
			}
			resources {
				srcDirs = [new File(rootDirFile, 'src/main/resources')]
			}
		}
	}
	tasks.named('compileJava') { dependsOn relocate }
	// Mod-Menu-Nachbau nie mitliefern – zur Laufzeit kommt die echte Mod Menu
	tasks.named('jar') { exclude 'com/terraformersmc/**' }

	repositories {
		maven {
			name = 'henkelmax'
			url = 'https://maven.maxhenkel.de/repository/public'
		}
		mavenCentral()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${mc.minecraft_version}"
		if (remap) {
			mappings loom.officialMojangMappings()
			modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
			modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric_api_version}"
		} else {
			implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
			implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric_api_version}"
		}

		// Simple Voice Chat ist zur Laufzeit als eigene Mod installiert
		compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"

		// MP3-Dekodierung, wird per Jar-in-Jar mitgeliefert
		implementation "javazoom:jlayer:${rootProject.jlayer_version}"
		include "javazoom:jlayer:${rootProject.jlayer_version}"
	}

	processResources {
		def props = [version: project.version.toString()]
		inputs.properties props
		filesMatching("fabric.mod.json") {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}
}

// Fertige Jar zusammensetzen:
//  - aus 1.21.11 (umgewandelt): Kern (Java 21), Ressourcen, fabric.mod.json, eingebettetes jlayer, Variante mc1_21_11
//  - aus 26.1/26.2/26.3: nur die jeweilige Client-Variante (unverschleiert, nicht umgewandelt)
def baseProject = subprojects.find { it.projectDir.name == baseVersion }

tasks.register('clean', Delete) {
	delete layout.buildDirectory
}

def merged = tasks.register('mergedJar', Jar) {
	group = 'build'
	description = 'Eine Jar für alle Minecraft-Versionen'
	archiveBaseName = rootProject.archives_base_name
	archiveVersion = rootProject.mod_version
	destinationDirectory = layout.buildDirectory.dir('libs')
	duplicatesStrategy = DuplicatesStrategy.FAIL

	dependsOn "${baseProject.path}:remapJar"
	from({ zipTree(baseProject.tasks.named('remapJar').get().archiveFile.get().asFile) }) {
		exclude 'com/terraformersmc/**'
		exclude 'META-INF/MANIFEST.MF'
	}
	subprojects.each { other ->
		if (other == baseProject) return
		def otherVariant = 'mc' + other.projectDir.name.replace('.', '_')
		dependsOn "${other.path}:compileJava"
		from(new File(other.projectDir, 'build/classes/java/main')) {
			include "de/ximjxstinn/voiceboard/${otherVariant}/**"
		}
	}
}

tasks.register('build') {
	dependsOn subprojects.collect { "${it.path}:build" }
	dependsOn merged
}
