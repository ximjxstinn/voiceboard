pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'voiceboard'

// Ein Unterprojekt pro Minecraft-Version (Ordner versions/<version>)
file('versions').eachDir { dir ->
	def name = 'mc' + dir.name.replace('.', '_')
	include name
	project(":${name}").projectDir = dir
}
